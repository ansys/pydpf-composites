[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "ansys-dpf-composites"
version = "0.9.dev0"
description = "Post-processing of composite structures based on Ansys DPF"
license = "MIT"
readme = "README.rst"
requires-python = ">=3.11,<4"
authors = [{ name = "ANSYS, Inc.", email = "ansys.support@ansys.com" }]
maintainers = [{ name = "PyAnsys developers", email = "pyansys.maintainers@ansys.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "packaging",
    "numpy>=1.25",
    "ansys-dpf-core @ git+https://github.com/ansys/pydpf-core.git",
    "matplotlib>=3.8.0",
]

[project.urls]
Repository = "https://github.com/ansys/pydpf-composites"
Documentation = "https://composites.dpf.docs.pyansys.com"

[project.optional-dependencies]
all = [
    "Sphinx>=5.0.1",
    "ansys-sphinx-theme",
    "sphinx-copybutton>=0.4",
    "sphinx-gallery>=0.11.0",
    "sphinx-design>=0.3.0",
    "numpydoc>=1.5",
    "pyvista[jupyter]>=0.40.2,!=0.44.2",
    "pytest>=7.1.2",
    "pytest-cov>=3.0.0",
    "pytest-rerunfailures>=11.1.2",
    "twine>=4.0.1",
    "build>=0.8.0",
    "mypy>=1.2.0",
    "mypy-extensions>=1.0.0",
    "pylint>=2.13",
    "pre-commit",
    "pypandoc>=1.8.1",
    "scipy>=1.9.0",
    "fatpack>=0.5",
    "sphinx-autodoc-typehints>=1.19,<1.20.2",
]
docs = [
    "Sphinx>=5.0.1",
    "ansys-sphinx-theme",
    "sphinx-copybutton>=0.4",
    "numpydoc>=1.5",
    "sphinx-gallery>=0.11.0",
    "pypandoc>=1.8.1",
    "sphinx-autodoc-typehints>=1.19,<1.20.2",
    "sphinx-design>=0.3.0",
    "scipy>=1.9.0",
    "pyvista[jupyter]>=0.40.2,!=0.44.2",
    "fatpack>=0.5",
]
examples = ["scipy>=1.9.0", "pyvista[jupyter]>=0.40.2,!=0.44.2", "fatpack>=0.5"]
test = ["pytest>=7.1.2", "pytest-cov>=3.0.0", "pytest-rerunfailures>=11.1.2"]
build = ["build>=0.8.0", "twine>=4.0.1"]
pre-commit = ["pre-commit", "mypy>=1.2.0", "mypy-extensions>=1.0.0", "pylint>=2.13"]

[dependency-groups]
dev = ["tox>=4", "tox-gh-actions", "tox-uv>=1.37"]

[tool.poetry]
packages = [{ include = "ansys", from = "src" }]


[tool.black]
line-length = 100

[tool.isort]
profile = "black"
force_sort_within_sections = true
line_length = 100
default_section = "THIRDPARTY"
src_paths = ["doc", "src", "tests"]

[tool.coverage.run]
source = ["ansys.dpf.composites"]

[tool.coverage.report]
show_missing = true

[tool.codespell]
skip = '*.dat,*.out,*.k'
ignore-words-list = 'ans,eyt,synopsys'
quiet-level = 3

[tool.pylint.messages_control]
disable = [
    "C",
    "R",
    # The 'attribute-defined-outside-init' and 'unused_argument' checks
    # produce too many false positives from constructors which go over
    # a pre-defined list of attributes (e.g. ATTRS_PUCK).
    "attribute-defined-outside-init",
    "unused-argument",
    "eval-used",
    "fixme",
]
[tool.pylint.typecheck]
ignored-classes = [
    "ansys.dpf.core.inputs.Inputs",
    "ansys.dpf.core.outputs.Outputs"
]

[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src:$MYPY_CONFIG_FILE_DIR/tests"
ignore_missing_imports = true
